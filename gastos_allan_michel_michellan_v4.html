<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="theme-color" content="#80cee1">
  <link rel="icon" id="fav" type="image/png">
  <link rel="apple-touch-icon" id="apl">
  <title>Controle de Gastos</title>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhcG-5BYNlKySkmfTI-P4_pPecqKb-VphJtW9-PxyB7gbUt2kYHXFxJLpctectJ_-9/exec';

    function makeIcon(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#80cee1';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.22);
      ctx.fill();
      ctx.font = (size * 0.6) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('\uD83D\uDCB0', size / 2, size / 2 + size * 0.04);
      return c.toDataURL('image/png');
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('fav').href = makeIcon(32);
      document.getElementById('apl').href = makeIcon(192);
    });
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════
       TEMA PADRÃO — Controle de Gastos
    ══════════════════════════════════════ */
    :root {
      --brand: #80cee1;
      --brand-dark: #3a9ab5;
      --topbar-text: #1a4f5e;
      --red-light: #FDECEA; --red-deep: #C0392B; --red-sel: #f5b8b5;
      --blue-light: #E8F0FE; --blue-deep: #2563A8; --blue-sel: #b5cef7;
      --pink-light: #FDE8F0; --pink-deep: #A0305A; --pink-sel: #f5b0cc;
      --green-btn: #b7e7c2; --green-btn-text: #1a5c30;
      --yellow-light: #FFF8E1; --yellow-deep: #B45309;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --border: #e0e4ea;
      --text: #1a1a2e;
      --text-muted: #6b7280;
      --radius-md: 10px;
      --radius-lg: 16px;
      /* partículas: off por padrão */
      --particles-display: none;
    }

    /* ══════════════════════════════════════
       TEMA: COPA + JUNINA (Jun/Jul 2026)
    ══════════════════════════════════════ */
    body.tema-copa {
      --brand: #f39c12;
      --brand-dark: #c0392b;
      --topbar-text: #4a1c00;
      --bg: #fff8f0;
      --surface: #fffaf4;
      --border: #f5c97a;
      --text: #4a1c00;
      --text-muted: #8c5a00;
      --green-btn: #f5c97a;
      --green-btn-text: #7d3c00;
    }

    /* ══════════════════════════════════════
       TEMA: FESTA JUNINA (Jun/Jul, outros anos)
    ══════════════════════════════════════ */
    body.tema-junina {
      --brand: #f39c12;
      --brand-dark: #c0392b;
      --topbar-text: #4a1c00;
      --bg: #fff8f0;
      --surface: #fffaf4;
      --border: #f5c97a;
      --text: #4a1c00;
      --text-muted: #8c5a00;
      --green-btn: #f5c97a;
      --green-btn-text: #7d3c00;
    }

    /* ══════════════════════════════════════
       TEMA: HALLOWEEN (Outubro)
    ══════════════════════════════════════ */
    body.tema-halloween {
      --brand: #e67e00;
      --brand-dark: #b35c00;
      --topbar-text: #fff3e0;
      --bg: #120500;
      --surface: #1a0a00;
      --border: #5a2d00;
      --text: #ffb347;
      --text-muted: #c07020;
      --green-btn: #6c0f7a;
      --green-btn-text: #f0a0ff;
    }

    /* ══════════════════════════════════════
       TEMA: NATAL (15/Nov → 06/Jan)
    ══════════════════════════════════════ */
    body.tema-natal {
      --brand: #1a7a2e;
      --brand-dark: #c8001c;
      --topbar-text: #ffffff;
      --bg: #f0faf2;
      --surface: #ffffff;
      --border: #a0d4a8;
      --text: #1a2e1c;
      --text-muted: #4a6b50;
      --green-btn: #c8001c;
      --green-btn-text: #ffffff;
    }

    /* ══════════════════════════════════════
       PARTÍCULAS ANIMADAS
    ══════════════════════════════════════ */
    .particles {
      position: fixed; inset: 0; pointer-events: none;
      overflow: hidden; z-index: 0;
      display: var(--particles-display, none);
    }
    .particle {
      position: absolute; top: -40px;
      animation: fall linear infinite; opacity: 0.55;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* ══════════════════════════════════════
       BANDEIRINHAS (Junina / Copa)
    ══════════════════════════════════════ */
    .bandeirinha-topo {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      justify-content: space-around; padding: 0 4px;
      z-index: 10; pointer-events: none;
    }
    body.tema-junina .bandeirinha-topo,
    body.tema-copa   .bandeirinha-topo { display: flex; }
    .bandeirinha-topo span {
      display: inline-block; width: 20px; height: 28px;
      clip-path: polygon(0 0, 100% 0, 100% 75%, 50% 100%, 0 75%); opacity: 0.9;
    }



    /* ══════════════════════════════════════
       LAYOUT BASE
    ══════════════════════════════════════ */
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 1rem;
      transition: background 0.5s, color 0.5s;
    }

    .screen {
      position: relative; z-index: 1;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border);
      width: 100%; max-width: 400px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      transition: background 0.5s, border-color 0.5s;
    }

    .topbar {
      background: var(--brand);
      padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.5s;
    }
    .topbar svg { flex-shrink: 0; }
    .topbar h1 { color: var(--topbar-text); font-size: 16px; font-weight: 600; flex: 1; transition: color 0.5s; }
    .topbar .back-btn {
      background: none; border: none; cursor: pointer;
      color: var(--topbar-text); font-size: 22px; padding: 2px 4px;
      display: none; align-items: center;
    }
    .topbar .back-btn.visible { display: flex; }

    .view { display: none; }
    .view.visible { display: block; }

    /* ══════════════════════════════════════
       VIEW: MENU
    ══════════════════════════════════════ */
    .menu-area { padding: 1.5rem 1.25rem; }
    .menu-titulo {
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 14px;
    }
    .menu-btns { display: flex; flex-direction: column; gap: 10px; }
    .menu-btn {
      width: 100%; padding: 16px 18px;
      border: 1.5px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); cursor: pointer; font-family: inherit;
      display: flex; align-items: center; gap: 14px;
      transition: all 0.18s; text-align: left;
    }
    .menu-btn:hover { border-color: var(--brand-dark); background: var(--bg); }
    .menu-btn .menu-icon { font-size: 28px; flex-shrink: 0; }
    .menu-btn .menu-text { flex: 1; }
    .menu-btn .menu-text strong { display: block; font-size: 14px; font-weight: 600; color: var(--text); }
    .menu-btn .menu-text span { display: block; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .menu-btn .arrow { color: var(--text-muted); font-size: 16px; }

    /* ══════════════════════════════════════
       TABS E PANELS
    ══════════════════════════════════════ */
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab {
      flex: 1; padding: 11px 4px; font-size: 13px; font-weight: 500;
      border: none; background: none; cursor: pointer; color: var(--text-muted);
      border-bottom: 2px solid transparent; font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: var(--brand-dark); border-bottom-color: var(--brand-dark); }
    .panel { display: none; }
    .panel.visible { display: block; }

    /* ══════════════════════════════════════
       FORMULÁRIO
    ══════════════════════════════════════ */
    .form-area { padding: 1rem 1.25rem; }
    .who-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .who-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .who-btn {
      padding: 10px 4px 8px; font-size: 13px; font-weight: 500;
      border-radius: var(--radius-md); border: 2px solid transparent;
      cursor: pointer; font-family: inherit; transition: all 0.18s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      position: relative;
    }
    .who-btn .emoji { font-size: 22px; }
    .who-btn .check { position: absolute; top: 5px; right: 6px; font-size: 11px; opacity: 0; transition: opacity 0.15s; }
    .who-btn.allan      { background: var(--red-light);  color: var(--red-deep);  }
    .who-btn.allan.sel  { border-color: var(--red-deep);  background: #f5b8b5; box-shadow: inset 0 0 0 1px var(--red-deep); }
    .who-btn.michel     { background: var(--blue-light); color: var(--blue-deep); }
    .who-btn.michel.sel { border-color: var(--blue-deep); background: #b5cef7; box-shadow: inset 0 0 0 1px var(--blue-deep); }
    .who-btn.michellan     { background: var(--pink-light); color: var(--pink-deep); }
    .who-btn.michellan.sel { border-color: var(--pink-deep); background: #f5b0cc; box-shadow: inset 0 0 0 1px var(--pink-deep); }
    .who-btn.sel .check { opacity: 1; }

    .form-row { margin-bottom: 12px; }
    .form-row label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 500; }
    .form-row select, .form-row input {
      width: 100%; padding: 9px 10px; font-size: 14px;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); color: var(--text); font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-row input[type=number]::-webkit-inner-spin-button,
    .form-row input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .form-row select:focus, .form-row input:focus { outline: none; border-color: var(--brand-dark); }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn-reg {
      width: 100%; padding: 11px; margin-top: 4px;
      border: none; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--green-btn); color: var(--green-btn-text);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-reg:hover { opacity: 0.88; }
    .btn-reg:active { transform: scale(0.98); }
    .btn-reg.sending { opacity: 0.55; pointer-events: none; }
    .btn-reg.erro-envio { background: #FDECEA; color: var(--red-deep); }

    /* ══════════════════════════════════════
       HISTÓRICO
    ══════════════════════════════════════ */
    .hist-area { padding: 0.75rem 0 0; }
    .hist-header {
      display: grid; grid-template-columns: 1.4fr 1.8fr 1.2fr 1.1fr; gap: 4px;
      padding: 6px 1.25rem; background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .hist-body { padding: 0 0 0.5rem; max-height: 55vh; overflow-y: auto; }
    .entry-row {
      display: grid; grid-template-columns: 1.4fr 1.8fr 1.2fr 1.1fr; gap: 4px;
      padding: 9px 1.25rem; border-bottom: 1px solid var(--border);
      font-size: 13px; align-items: center; animation: pop 0.2s ease;
      color: var(--text);
    }
    .entry-row:last-child { border-bottom: none; }
    .entry-row .lbl-mes { color: var(--text-muted); font-size: 11px; }
    .entry-row .val { font-weight: 600; text-align: right; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-align: center;
    }
    .badge.allan     { background: var(--red-light);  color: var(--red-deep);  }
    .badge.michel    { background: var(--blue-light); color: var(--blue-deep); }
    .badge.michellan { background: var(--pink-light); color: var(--pink-deep); }
    .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 2.5rem 1rem; }
    .total-bar {
      display: flex; justify-content: space-between;
      padding: 10px 1.25rem; border-top: 1px solid var(--border);
      font-size: 13px; font-weight: 600; background: var(--bg);
      color: var(--text);
    }
    .total-bar span:last-child { color: var(--green-btn-text); }

    /* ══════════════════════════════════════
       VIEW: DINHEIRO
    ══════════════════════════════════════ */
    .din-setup { padding: 1.25rem; }

    .saldo-card {
      margin: 0 1.25rem 1rem;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; justify-content: space-between;
    }
    .saldo-card.positivo { border-color: #86efac; background: #f0fdf4; }
    .saldo-card.negativo { border-color: #fca5a5; background: #fef2f2; }
    .saldo-card.carregando { border-color: var(--border); background: var(--bg); }
    .saldo-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .saldo-valor { font-size: 20px; font-weight: 700; color: var(--text); }
    .saldo-card.positivo .saldo-valor { color: #15803d; }
    .saldo-card.negativo .saldo-valor { color: var(--red-deep); }
    .saldo-spinner { font-size: 18px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .din-form { padding: 0 1.25rem 1.25rem; }

    /* ══════════════════════════════════════
       TOAST
    ══════════════════════════════════════ */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 24px;
      font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
      white-space: nowrap; z-index: 99;
    }
    .toast.ok  { background: #1a5c30; color: #fff; }
    .toast.err { background: var(--red-deep); color: #fff; }
    .toast.show { opacity: 1; }

    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .err-field { border-color: var(--red-deep) !important; }

    /* ══════════════════════════════════════
       TELA DE LOGIN
    ══════════════════════════════════════ */
    #tela-login {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; transition: opacity 0.35s;
    }
    #tela-login.saindo { opacity: 0; pointer-events: none; }
    .login-card {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 0.5px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%; max-width: 340px; overflow: hidden;
    }
    .login-header { background: var(--brand); padding: 2rem 1.5rem 1.5rem; text-align: center; transition: background 0.5s; }
    .login-header .lock-icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .login-header h2 { color: var(--topbar-text); font-size: 17px; font-weight: 600; margin: 0; transition: color 0.5s; }
    .login-header p { color: var(--topbar-text); opacity: 0.75; font-size: 13px; margin-top: 4px; }
    .login-body { padding: 1.5rem; }
    .login-body label {
      font-size: 12px; color: var(--text-muted); font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px;
    }
    .login-input-wrap { position: relative; }
    .login-input-wrap input {
      width: 100%; padding: 11px 40px 11px 12px;
      font-size: 18px; letter-spacing: 4px; text-align: center;
      border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--surface); color: var(--text); font-family: inherit;
    }
    .login-input-wrap input:focus { outline: none; border-color: var(--brand-dark); }
    .login-input-wrap input.err-field { border-color: var(--red-deep); animation: shake 0.3s; }
    .toggle-pass {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px;
      color: var(--text-muted); padding: 4px;
    }
    .login-erro { font-size: 12px; color: var(--red-deep); text-align: center; margin-top: 8px; min-height: 16px; }
    .btn-entrar {
      width: 100%; padding: 12px; margin-top: 16px;
      border: none; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; background: var(--brand-dark); color: var(--topbar-text);
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-entrar:hover { opacity: 0.88; }
    .btn-entrar:active { transform: scale(0.98); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-6px); }
      40%,80%  { transform: translateX(6px); }
    }
  </style>
</head>
<body>

<!-- Bandeirinhas (Junina / Copa) -->
<div class="bandeirinha-topo" id="bandeirinhas-topo"></div>

<!-- Partículas decorativas -->
<div class="particles" id="particles"></div>

<!-- ══ TELA DE LOGIN ══ -->
<div id="tela-login">
  <div class="login-card">
    <div class="login-header">
      <span class="lock-icon" id="login-icon">🔐</span>
      <h2>Controle de Gastos</h2>
      <p>Digite a senha para entrar</p>
    </div>
    <div class="login-body">
      <label for="campo-senha">Senha</label>
      <div class="login-input-wrap">
        <input type="password" id="campo-senha" inputmode="numeric"
               maxlength="20" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') tentarEntrar()">
        <button class="toggle-pass" onclick="toggleVerSenha()" tabindex="-1">👁</button>
      </div>
      <div class="login-erro" id="login-erro"></div>
      <button class="btn-entrar" onclick="tentarEntrar()">Entrar</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div class="screen">
  <div class="topbar">
    <button class="back-btn" id="back-btn" onclick="voltarMenu()" aria-label="Voltar">&#8592;</button>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--topbar-text)">
      <path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
      <path d="M16 3H8L6 7h12l-2-4z"/>
      <circle cx="17" cy="13" r="1" fill="currentColor"/>
    </svg>
    <h1 id="topbar-titulo">Controle de Gastos</h1>
  </div>

  <!-- ════ VIEW: MENU ════ -->
  <div class="view visible" id="view-menu">
    <div class="menu-area">
      <div class="menu-titulo">O que você quer registrar?</div>
      <div class="menu-btns">
        <button class="menu-btn cartao" onclick="irParaCartao()">
          <span class="menu-icon">💳</span>
          <span class="menu-text">
            <strong>Gasto no Cartão</strong>
            <span>Registrar gasto de cartão de crédito</span>
          </span>
          <span class="arrow">›</span>
        </button>
        <button class="menu-btn dinheiro" onclick="irParaDinheiro()">
          <span class="menu-icon">💵</span>
          <span class="menu-text">
            <strong>Gasto no Dinheiro</strong>
            <span>Ver saldo e registrar gasto em espécie</span>
          </span>
          <span class="arrow">›</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ════ VIEW: CARTÃO ════ -->
  <div class="view" id="view-cartao">
    <div class="tabs">
      <button class="tab active" onclick="showPanel('reg', this)">＋ Registrar</button>
      <button class="tab" onclick="showPanel('hist', this)">☰ Lançamentos</button>
    </div>

    <div class="panel visible" id="panel-reg">
      <div class="form-area">
        <div class="who-label">Gasto de quem?</div>
        <div class="who-btns">
          <button class="who-btn allan sel" onclick="selectWho('allan', this, 'cartao')">
            <span class="check">✓</span><span class="emoji">👨🏻‍🦱</span>Allan
          </button>
          <button class="who-btn michel" onclick="selectWho('michel', this, 'cartao')">
            <span class="check">✓</span><span class="emoji">👨🏽‍🦱</span>Michel
          </button>
          <button class="who-btn michellan" onclick="selectWho('michellan', this, 'cartao')">
            <span class="check">✓</span><span class="emoji">🩷</span>Michellan
          </button>
        </div>
        <div class="split">
          <div class="form-row">
            <label>Mês</label>
            <select id="mes-cartao"></select>
          </div>
          <div class="form-row">
            <label>Ano</label>
            <input type="number" id="ano-cartao" value="2026" min="2020" max="2099" style="text-align:center;">
          </div>
        </div>
        <div class="form-row">
          <label>Descrição do gasto</label>
          <input type="text" id="desc-cartao" placeholder="Ex: Mercado, Academia...">
        </div>
        <div class="form-row">
          <label>Valor (R$)</label>
          <input type="text" id="valor-cartao" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off">
        </div>
        <button class="btn-reg" id="btn-cartao" onclick="registrar('cartao')">
          ✈ Registrar gasto
        </button>
      </div>
    </div>

    <div class="panel" id="panel-hist">
      <div class="hist-area">
        <div class="hist-header">
          <span>Período</span><span>Gasto</span>
          <span style="text-align:right">Valor</span>
          <span style="text-align:center">Quem</span>
        </div>
        <div class="hist-body" id="hist-body">
          <div class="empty">Nenhum lançamento ainda</div>
        </div>
        <div class="total-bar" id="total-bar" style="display:none">
          <span>Total registrado</span>
          <span id="total-val"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ════ VIEW: DINHEIRO ════ -->
  <div class="view" id="view-dinheiro">

    <div class="din-setup" id="din-setup">
      <div class="who-label">Quem está gastando?</div>
      <div class="who-btns" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">
        <button class="who-btn allan sel" id="din-btn-allan" onclick="selectWho('allan', this, 'dinheiro')">
          <span class="check">✓</span><span class="emoji">👨🏻‍🦱</span>Allan
        </button>
        <button class="who-btn michel" id="din-btn-michel" onclick="selectWho('michel', this, 'dinheiro')">
          <span class="check">✓</span><span class="emoji">👨🏽‍🦱</span>Michel
        </button>
      </div>
      <div class="form-row">
        <label>Mês de referência</label>
        <select id="mes-dinheiro" onchange="buscarSaldo()"></select>
      </div>
    </div>

    <div class="saldo-card carregando" id="saldo-card">
      <div>
        <div class="saldo-label" id="saldo-label">Buscando saldo...</div>
        <div class="saldo-valor" id="saldo-valor">—</div>
      </div>
      <span class="saldo-spinner" id="saldo-spinner">⏳</span>
    </div>

    <div class="din-form">
      <div class="form-row">
        <label>Descrição do gasto</label>
        <input type="text" id="desc-dinheiro" placeholder="Ex: Padaria, Uber...">
      </div>
      <div class="form-row">
        <label>Valor (R$)</label>
        <input type="text" id="valor-dinheiro" inputmode="numeric" placeholder="R$ 0,00" autocomplete="off">
      </div>
      <button class="btn-reg" id="btn-dinheiro" onclick="registrar('dinheiro')">
        ✈ Registrar gasto
      </button>
    </div>
  </div>

</div><!-- /.screen -->

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════════════════
const SENHA       = '16102018';
const STORAGE_KEY = 'gastos_historico';

let quemCartao   = 'allan';
let quemDinheiro = 'allan';
let centavosCartao   = 0;
let centavosDinheiro = 0;
let saldoAtual = null;

const lancamentos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ═══════════════════════════════════════════════════════
//  🎨  SISTEMA DE TEMAS
// ═══════════════════════════════════════════════════════
const TEMAS = {
  padrao: {
    classe: '',
    loginIcon: '🔐',
    particles: []
  },
  junina: {
    classe: 'tema-junina',
    loginIcon: '🎪',
    particles: ['🌽','⭐','🎇','🎆']
  },
  copa: {
    classe: 'tema-copa',
    loginIcon: '⚽',
    particles: ['⚽','🌽','🇧🇷','⭐']
  },
  halloween: {
    classe: 'tema-halloween',
    loginIcon: '🎃',
    particles: ['🦇','🕷️','🎃','🕸️']
  },
  natal: {
    classe: 'tema-natal',
    loginIcon: '🎄',
    particles: ['❄️','⭐','🎄','✨']
  }
};

function detectarTema() {
  const hoje = new Date();
  const ano  = hoje.getFullYear();
  const mes  = hoje.getMonth() + 1; // 1–12
  const dia  = hoje.getDate();

  // Natal: 15/Nov → 06/Jan
  if ((mes === 11 && dia >= 15) || mes === 12 || (mes === 1 && dia <= 6)) return 'natal';
  // Halloween: todo outubro
  if (mes === 10) return 'halloween';
  // Junho e Julho
  if (mes === 6 || mes === 7) return ano === 2026 ? 'copa' : 'junina';
  return 'padrao';
}

function aplicarTema() {
  const temaKey = detectarTema();
  const tema    = TEMAS[temaKey];

  // Remove classes anteriores
  document.body.classList.remove('tema-junina','tema-copa','tema-halloween','tema-natal');
  if (tema.classe) document.body.classList.add(tema.classe);

  // Ícone do login
  const loginIcon = document.getElementById('login-icon');
  if (loginIcon) loginIcon.textContent = tema.loginIcon;

  // Partículas
  gerarParticulas(tema.particles, temaKey);

  // Bandeirinhas
  gerarBandeirinhas(temaKey === 'junina' || temaKey === 'copa');
}

function gerarParticulas(emojis, temaKey) {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  if (!emojis || emojis.length === 0) return;

  container.style.display = 'block';
  const qtd = temaKey === 'halloween' ? 12 : 18;

  for (let i = 0; i < qtd; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left             = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    p.style.animationDelay   = (Math.random() * 12) + 's';
    p.style.fontSize         = (0.9 + Math.random() * 1.2) + 'rem';
    if (temaKey === 'halloween') p.style.opacity = '0.2';
    container.appendChild(p);
  }
}

const CORES_BANDEIRINHA = [
  '#c0392b','#f39c12','#27ae60','#2980b9',
  '#8e44ad','#e74c3c','#f1c40f','#1abc9c'
];

function gerarBandeirinhas(mostrar) {
  const el = document.getElementById('bandeirinhas-topo');
  el.innerHTML = '';
  if (!mostrar) return;
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.style.background = CORES_BANDEIRINHA[i % CORES_BANDEIRINHA.length];
    el.appendChild(s);
  }
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  // Aplica tema sazonal
  aplicarTema();

  const mesAtual = MESES[new Date().getMonth()];

  ['mes-cartao', 'mes-dinheiro'].forEach(function(id) {
    const sel = document.getElementById(id);
    MESES.forEach(function(m) {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      if (m === mesAtual) opt.selected = true;
      sel.appendChild(opt);
    });
  });

  if (lancamentos.length) renderHist();
});

// ═══════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════
function tentarEntrar() {
  const input = document.getElementById('campo-senha');
  const erro  = document.getElementById('login-erro');
  if (input.value === SENHA) {
    erro.textContent = '';
    const tela = document.getElementById('tela-login');
    tela.classList.add('saindo');
    setTimeout(() => tela.style.display = 'none', 360);
  } else {
    input.classList.add('err-field');
    erro.textContent = 'Senha incorreta. Tente novamente.';
    input.value = '';
    setTimeout(() => input.classList.remove('err-field'), 600);
    input.focus();
  }
}
function toggleVerSenha() {
  const i = document.getElementById('campo-senha');
  i.type = i.type === 'password' ? 'text' : 'password';
}

// ═══════════════════════════════════════════════════════
//  NAVEGAÇÃO
// ═══════════════════════════════════════════════════════
function mostrarView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('visible'));
  document.getElementById('view-' + id).classList.add('visible');
}

function irParaCartao() {
  mostrarView('cartao');
  document.getElementById('topbar-titulo').textContent = 'Gasto no Cartão';
  document.getElementById('back-btn').classList.add('visible');
}

function irParaDinheiro() {
  mostrarView('dinheiro');
  document.getElementById('topbar-titulo').textContent = 'Gasto no Dinheiro';
  document.getElementById('back-btn').classList.add('visible');
  buscarSaldo();
}

function voltarMenu() {
  mostrarView('menu');
  document.getElementById('topbar-titulo').textContent = 'Controle de Gastos';
  document.getElementById('back-btn').classList.remove('visible');
}

function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
  document.getElementById('panel-' + id).classList.add('visible');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

// ═══════════════════════════════════════════════════════
//  SELEÇÃO DE PESSOA
// ═══════════════════════════════════════════════════════
function selectWho(who, el, contexto) {
  if (contexto === 'cartao') {
    quemCartao = who;
    document.querySelectorAll('#view-cartao .who-btn').forEach(b => b.classList.remove('sel'));
  } else {
    quemDinheiro = who;
    document.querySelectorAll('#view-dinheiro .who-btn').forEach(b => b.classList.remove('sel'));
    buscarSaldo();
  }
  el.classList.add('sel');
}

// ═══════════════════════════════════════════════════════
//  CAMPO VALOR (centavos inteligentes)
// ═══════════════════════════════════════════════════════
function setupValorInput(inputId, getter, setter) {
  const el = document.getElementById(inputId);

  function fmt(c) {
    if (c === 0) return '';
    const s = String(c).padStart(3, '0');
    return 'R$ ' + s.slice(0, -2).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + s.slice(-2);
  }

  el.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace') {
      setter(Math.floor(getter() / 10));
      this.value = fmt(getter());
      e.preventDefault();
    }
  });
  el.addEventListener('input', function(e) {
    const d = (e.data || '').replace(/\D/g, '');
    if (!d) return;
    for (const x of d) {
      if (getter() > 9999999) continue;
      setter(getter() * 10 + parseInt(x));
    }
    this.value = fmt(getter());
  });
  el.addEventListener('focus', function() { this.classList.remove('err-field'); });

  return {
    getFloat: () => getter() / 100,
    reset: () => { setter(0); el.value = ''; }
  };
}

const valorCartao   = setupValorInput('valor-cartao',
  () => centavosCartao,   v => centavosCartao = v);
const valorDinheiro = setupValorInput('valor-dinheiro',
  () => centavosDinheiro, v => centavosDinheiro = v);

// ═══════════════════════════════════════════════════════
//  BUSCAR SALDO (doGet)
// ═══════════════════════════════════════════════════════
function buscarSaldo() {
  const mes    = document.getElementById('mes-dinheiro').value;
  const pessoa = quemDinheiro;
  if (!mes) return;

  const card    = document.getElementById('saldo-card');
  const label   = document.getElementById('saldo-label');
  const valor   = document.getElementById('saldo-valor');
  const spinner = document.getElementById('saldo-spinner');

  card.className = 'saldo-card carregando';
  label.textContent = 'Buscando saldo...';
  valor.textContent = '—';
  spinner.style.display = 'block';
  saldoAtual = null;

  const url = APPS_SCRIPT_URL
    + '?pessoa=' + encodeURIComponent(capitalizarPessoa(pessoa))
    + '&mes='    + encodeURIComponent(mes);

  fetch(url)
    .then(r => r.json())
    .then(function(data) {
      spinner.style.display = 'none';
      if (data.status === 'ok') {
        saldoAtual = parseFloat(data.saldo) || 0;
        label.textContent = 'Saldo disponível em ' + mes;
        valor.textContent = formatarMoeda(saldoAtual);
        card.className = 'saldo-card ' + (saldoAtual >= 0 ? 'positivo' : 'negativo');
      } else {
        label.textContent = 'Não foi possível carregar';
        valor.textContent = data.mensagem || 'Erro';
        card.className = 'saldo-card negativo';
      }
    })
    .catch(function() {
      spinner.style.display = 'none';
      label.textContent = 'Erro de conexão';
      valor.textContent = 'Tente novamente';
      card.className = 'saldo-card negativo';
    });
}

// ═══════════════════════════════════════════════════════
//  REGISTRAR GASTO
// ═══════════════════════════════════════════════════════
function registrar(tipo) {
  const isCartao = tipo === 'cartao';

  const mes   = document.getElementById(isCartao ? 'mes-cartao'   : 'mes-dinheiro').value;
  const ano   = isCartao ? (document.getElementById('ano-cartao').value || '2026') : String(new Date().getFullYear());
  const desc  = document.getElementById(isCartao ? 'desc-cartao'  : 'desc-dinheiro').value.trim();
  const quem  = isCartao ? quemCartao : quemDinheiro;
  const vCtrl = isCartao ? valorCartao : valorDinheiro;
  const valor = vCtrl.getFloat();

  const descEl  = document.getElementById(isCartao ? 'desc-cartao'  : 'desc-dinheiro');
  const valorEl = document.getElementById(isCartao ? 'valor-cartao' : 'valor-dinheiro');
  const btnId   = isCartao ? 'btn-cartao' : 'btn-dinheiro';
  const btn     = document.getElementById(btnId);

  descEl.classList.remove('err-field');
  valorEl.classList.remove('err-field');
  let ok = true;
  if (!desc)     { descEl.classList.add('err-field');  ok = false; }
  if (valor <= 0){ valorEl.classList.add('err-field'); ok = false; }
  if (!ok) return;

  btn.classList.add('sending');
  btn.textContent = '⏳ Enviando...';

  const payload = {
    mes, ano, desc, valor,
    pessoa: capitalizarPessoa(quem),
    tipo: isCartao ? 'Cartão' : 'Dinheiro',
    dispositivo: detectarDispositivo()
  };

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(function() {
    lancamentos.unshift({ mes, ano, desc, valor, quem, tipo: payload.tipo });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lancamentos));
    renderHist();
    descEl.value = '';
    vCtrl.reset();
    btn.classList.remove('sending');
    btn.textContent = '✈ Registrar gasto';
    toast('✓ Gasto enviado!', 'ok');

    if (!isCartao && saldoAtual !== null) {
      saldoAtual -= valor;
      document.getElementById('saldo-valor').textContent = formatarMoeda(saldoAtual);
      const card = document.getElementById('saldo-card');
      card.className = 'saldo-card ' + (saldoAtual >= 0 ? 'positivo' : 'negativo');
    }
  })
  .catch(function() {
    btn.classList.remove('sending');
    btn.classList.add('erro-envio');
    btn.textContent = '⚠ Erro ao enviar — tente novamente';
    setTimeout(() => {
      btn.classList.remove('erro-envio');
      btn.textContent = '✈ Registrar gasto';
    }, 3000);
    toast('Erro ao conectar com a planilha', 'err');
  });
}

// ═══════════════════════════════════════════════════════
//  HISTÓRICO
// ═══════════════════════════════════════════════════════
function renderHist() {
  const body = document.getElementById('hist-body');
  if (!lancamentos.length) {
    body.innerHTML = '<div class="empty">Nenhum lançamento ainda</div>';
    document.getElementById('total-bar').style.display = 'none';
    return;
  }
  body.innerHTML = lancamentos.map(function(l) {
    const tipoTag = l.tipo === 'Dinheiro'
      ? '<span style="font-size:10px;background:#FFF8E1;color:#B45309;padding:1px 5px;border-radius:8px;margin-left:3px;">💵</span>'
      : '';
    return `<div class="entry-row">
      <span class="lbl-mes">${l.mes} ${l.ano}</span>
      <span>${l.desc}${tipoTag}</span>
      <span class="val">R$ ${l.valor.toFixed(2).replace('.', ',')}</span>
      <span style="text-align:center"><span class="badge ${l.quem}">${capitalizarPessoa(l.quem)}</span></span>
    </div>`;
  }).join('');
  const total = lancamentos.reduce((s, l) => s + l.valor, 0);
  document.getElementById('total-val').textContent = 'R$ ' + total.toFixed(2).replace('.', ',');
  document.getElementById('total-bar').style.display = 'flex';
}

// ═══════════════════════════════════════════════════════
//  UTILITÁRIOS
// ═══════════════════════════════════════════════════════
function capitalizarPessoa(p) {
  return { allan: 'Allan', michel: 'Michel', michellan: 'Michellan' }[p] || p;
}

function formatarMoeda(v) {
  return 'R$ ' + Math.abs(v).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')
    + (v < 0 ? ' (negativo)' : '');
}

function detectarDispositivo() {
  const ua = navigator.userAgent || '';
  const standalone = window.navigator.standalone;
  const isAndroidApp = window.matchMedia('(display-mode: standalone)').matches;
  if (/iPhone|iPad|iPod/i.test(ua)) return standalone ? 'iOS (App)' : 'iOS (Safari)';
  if (/Android/i.test(ua)) return isAndroidApp ? 'Android (App)' : 'Android (Navegador)';
  return 'Web Desktop';
}

function toast(msg, tipo = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + tipo;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
